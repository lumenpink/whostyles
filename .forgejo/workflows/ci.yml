name: Automated Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-js:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/mirror-node:24-bookworm-slim
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v4

      - name: Execute JS Tests
        run: node tests/verify_core.js

  test-php:
    name: PHP Tests
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-php:latest
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v4

      - name: Execute PHP Tests
        run: php tests/verify.php

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-python:latest
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v4

      - name: Execute Python Tests
        run: python tests/verify_python.py

  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-go:latest
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v4

      - name: Execute Go Tests
        run: go run tests/verify_go.go

  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-rust:latest
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v4

      - name: Execute Rust Tests
        run: cd src/rust/whostyles && cargo test
